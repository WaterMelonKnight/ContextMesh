spring:
  application:
    name: ContextMesh
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/contextmesh}
    username: ${DATABASE_USER:contextmesh}
    password: ${DATABASE_PASSWORD:contextmesh}
  flyway:
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health
contextmesh:
  providers:
    openai-compatible:
      enabled: ${CONTEXTMESH_OPENAI_ENABLED:false}
      base-url: ${CONTEXTMESH_OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${CONTEXTMESH_OPENAI_API_KEY:}
      connection-timeout: ${CONTEXTMESH_OPENAI_CONNECTION_TIMEOUT:10s}
      read-timeout: ${CONTEXTMESH_OPENAI_READ_TIMEOUT:2m}
